<script>
const QUESTOES = [
  {"num":1,"exame":"XLV Exame — 2025","titulo":"Furto e Inexigibilidade de Conduta Diversa","enunciado":"Bernardo, gerente bancário, teve seu filho sequestrado por terceiros, que exigiram o pagamento de um milhão de reais para devolvê-lo com vida. Bernardo utilizou sua condição funcional e subtraiu a quantia da agência bancária em que trabalhava, sendo flagrado quando chegava em casa com o dinheiro.","comando":"Sobre a situação hipotética, assinale a afirmativa correta.","gabarito":"B","alt":{"A":"Agiu amparado por exercício regular de direito.","B":"Está isento de pena por inexigibilidade de conduta diversa.","C":"Agiu em legítima defesa de terceiro e está excluída a antijuridicidade da conduta.","D":"Deve responder por furto consumado, pois teve posse pacífica do dinheiro."},"fb":{"A":"Não existe exercício regular de direito para subtrair patrimônio alheio — mesmo em situação extrema, o direito não autoriza a prática de crime patrimonial.","B":"Bernardo agiu sob fortíssima coação moral — sequestro do filho com risco à vida. O Direito não podia razoavelmente exigir outra conduta. Aplica-se a inexigibilidade de conduta diversa: causa supralegal de exclusão da culpabilidade. O fato permanece típico e ilícito, mas Bernardo não é culpável.","C":"Legítima defesa exige agressão injusta atual ou iminente contra quem reage. Bernardo não praticou ato de defesa — praticou um crime contra terceiro estranho à agressão.","D":"A questão não cobra o momento da consumação, e sim a culpabilidade: Bernardo está isento de pena por inexigibilidade de conduta diversa. Lembre-se: pela teoria da amotio, a consumação do furto não depende de posse mansa e pacífica (veja a Q8)."},"fund":"Teoria da culpabilidade: a inexigibilidade de conduta diversa é causa supralegal de exclusão da culpabilidade. Quando circunstâncias extremas tornam inexigível comportamento diverso, o agente não é culpável — mesmo que o fato continue típico e ilícito.","caqui":"Atenção à estrutura do crime: fato típico + ilícito + culpável. O furto de Bernardo é típico (subtraiu) e ilícito (não havia excludente de antijuridicidade). Mas não é culpável — inexigibilidade de conduta diversa. Não confunda com legítima defesa (que exclui a ilicitude) nem com exercício regular de direito. Sequestro do filho = pressão extrema = Direito não exige heroísmo."},
  {"num":2,"exame":"XLV Exame — 2025","titulo":"Desistência Voluntária e Violação de Domicílio","enunciado":"João planejou apropriar-se do dinheiro dos dízimos guardados por Pedro em urna localizada no quarto deste, nos fundos da igreja. Durante a noite: pulou o muro; arrombou a fechadura; aproximou-se da urna; mas desistiu espontaneamente após reflexão religiosa e foi embora sem subtrair qualquer valor.","comando":"Sobre a situação, assinale a afirmativa correta.","gabarito":"D","alt":{"A":"João percorreu cogitação, preparação e execução, mas não houve exaurimento, imprescindível para tentativa.","B":"João praticou tentativa de furto.","C":"João praticou tentativa imperfeita de furto.","D":"João consumou o crime de violação de domicílio."},"fb":{"A":"Exaurimento não é requisito para tentativa — é a fase posterior à consumação. A tentativa exige início da execução e não consumação por circunstâncias alheias à vontade do agente.","B":"João desistiu voluntariamente — não houve tentativa punível de furto. Art. 15, CP: desistência voluntária = responde apenas pelos atos já praticados.","C":"Tentativa imperfeita = o agente não esgota os meios à sua disposição. Aqui houve desistência voluntária, não tentativa.","D":"João desistiu voluntariamente do furto (art. 15, CP) — não responde por tentativa de furto. MAS já havia consumado a violação de domicílio ao ingressar sem autorização na residência. Responde pelos atos já praticados."},"fund":"Art. 15, CP: desistência voluntária e arrependimento eficaz — o agente responde apenas pelos atos já praticados. Art. 150, CP: violação de domicílio — ingressar em casa alheia contra a vontade do morador. O crime de violação já estava consumado quando João arrombou e entrou.","caqui":"Desistência voluntária = o agente para por vontade própria. Consequência: não responde pela tentativa do crime desistido. MAS responde pelos crimes que já praticou no caminho. João não responde por tentativa de furto — mas responde por violação de domicílio, que já estava consumada quando ele entrou. Ponte de ouro: o Direito recompensa quem recua, mas não apaga o que já aconteceu."},
  {"num":3,"exame":"XLIII Exame — 2025","titulo":"Concurso de Pessoas e Resultado Mais Grave","enunciado":"Ateneu e Moisés combinaram praticar um furto. Moisés aguardou no carro para auxiliar a fuga; Ateneu entrou na residência para subtrair bens. Ao ingressar no imóvel, Ateneu encontrou Izabel, empregada doméstica da casa, e, sem que Moisés soubesse que ele portava arma, matou-a com um tiro. Depois, Ateneu subtraiu joias e dinheiro. Moisés, ao descobrir a morte, recusou qualquer parte dos bens.","comando":"Diante da situação, assinale a afirmativa correta.","gabarito":"D","alt":{"A":"Moisés não praticou fato criminalmente punível.","B":"Ambos praticaram, em coautoria, homicídio e roubo.","C":"Ateneu praticou furto qualificado pelo resultado morte.","D":"Moisés deve ser responsabilizado mediante aplicação da pena relativa ao crime de furto."},"fb":{"A":"Moisés participou conscientemente do furto — responde por ele.","B":"Moisés desconhecia a arma e não aderiu ao homicídio. Não há dolo comum quanto à morte.","C":"Furto qualificado pelo resultado morte não existe no CP. A morte praticada com violência durante subtração configura latrocínio (roubo qualificado pela morte) — art. 157, §3º, CP.","D":"Art. 29, §2º, CP (cooperação dolosamente distinta): Moisés quis participar apenas do furto. Como não sabia da arma e não era previsível o homicídio (em princípio), responde pelo crime menos grave ao qual aderiu — o furto. A recusa do espólio não altera sua responsabilidade penal anterior."},"fund":"Art. 29, §2º, CP: se algum dos concorrentes quis participar de crime menos grave, será-lhe aplicada a pena deste. Pode haver aumento se o resultado mais grave era previsível. Moisés não sabia da arma — responde pelo furto, crime pelo qual aderiu.","caqui":"Cooperação dolosamente distinta: cada um responde pelo crime ao qual aderiu. Moisés combinou furto — responde por furto. Ateneu foi além (matou) — responde pelo resultado mais grave. A recusa dos bens por Moisés é gesto moral, mas não apaga a participação anterior. E atenção: furto qualificado pelo resultado morte não existe — quando há morte com violência na subtração, o nome certo é latrocínio."},
  {"num":4,"exame":"XLIII Exame — 2025","titulo":"Dano Qualificado ao Patrimônio Público","enunciado":"Durante manifestação pacífica contra aumento da tarifa de ônibus, Rodrigo arremessou uma pedra contra uma viatura da Polícia Militar, quebrando dolosamente o vidro do para-brisa.","comando":"Assinale o crime cometido por Rodrigo.","gabarito":"C","alt":{"A":"Terrorismo.","B":"Dano simples.","C":"Dano qualificado.","D":"Ilícito civil, pois a conduta não configura crime."},"fb":{"A":"Terrorismo (Lei 13.260/2016) exige motivação ideológica extremista, terror social, finalidade política específica. Quebrar uma viatura em manifestação não configura terrorismo.","B":"O dano foi praticado contra patrimônio público — incide qualificadora.","C":"Art. 163, parágrafo único, III, CP: dano qualificado quando praticado contra patrimônio da União, Estado, Município, empresa concessionária de serviços públicos ou qualquer entidade pública. Viatura da PM = patrimônio público = dano qualificado.","D":"A conduta é crime de dano qualificado — gera responsabilidade penal E civil."},"fund":"Art. 163, parágrafo único, III, CP: dano qualificado quando praticado contra o patrimônio da União, de Estado, do Distrito Federal, de Município ou de autarquia, fundação pública, empresa pública, sociedade de economia mista ou empresa concessionária de serviços públicos.","caqui":"Regra simples: quebrou bem público dolosamente = dano qualificado. Não importa o contexto político da manifestação. A banca coloca terrorismo para confundir — mas terrorismo tem requisitos específicos bem mais exigentes (motivação extremista, terror social). Aqui é dano doloso a viatura pública = dano qualificado, puro e simples."},
  {"num":5,"exame":"XL Exame — 2024","titulo":"Extorsão com Restrição da Liberdade da Vítima","enunciado":"Joaquim foi abordado por Gilson, armado, quando se dirigia ao banco. Gilson obrigou Joaquim a entrar em seu carro e o levou até um motel, onde exigiu transferências bancárias via PIX e TED. A vítima permaneceu privada de liberdade por tempo relevante, condição necessária para obtenção da vantagem econômica de R$ 12.000,00. Após as transferências, Joaquim foi liberado.","comando":"Assinale a opção correta.","gabarito":"D","alt":{"A":"Roubo circunstanciado pelo emprego de arma de fogo.","B":"Extorsão mediante sequestro.","C":"Sequestro ou cárcere privado.","D":"Extorsão mediante restrição da liberdade da vítima."},"fb":{"A":"No roubo, o agente subtrai diretamente o bem. Aqui Joaquim foi constrangido a realizar as transferências — ele fez o ato patrimonial, não Gilson. Isso é extorsão, não roubo.","B":"Na extorsão mediante sequestro (art. 159), a privação da liberdade é usada como condição ou preço do resgate — a vantagem é exigida em troca da libertação. No sequestro relâmpago (art. 158, §3º), a própria vítima é constrangida a entregar a vantagem (PIX, TED, saque), e a restrição da liberdade é o meio necessário para obtê-la. É o caso de Joaquim.","C":"Sequestro/cárcere privado (art. 148) é o crime-fim de privar a liberdade. Aqui a privação foi meio para obter vantagem econômica — o crime principal é a extorsão.","D":"Art. 158, §3º, CP (incluído pela Lei 11.923/2009): extorsão praticada mediante restrição da liberdade da vítima, sendo essa condição necessária para a obtenção da vantagem econômica. É o tipo penal do chamado sequestro relâmpago."},"fund":"Art. 158, §3º, CP (Lei 11.923/2009): se o crime é cometido mediante a restrição da liberdade da vítima, e essa condição é necessária para a obtenção da vantagem econômica, a pena é de reclusão, de 6 a 12 anos, além da multa; se resulta lesão corporal grave ou morte, aplicam-se as penas do art. 159, §§2º e 3º. Art. 158, §4º (Lei 15.358/2026): pena aplicada em triplo se cometido por integrante de organização criminosa, grupo paramilitar ou milícia privada, nesse contexto.","caqui":"A Lei 11.923/2009 criou o §3º do art. 158 para os sequestros relâmpagos (a pessoa é levada e forçada a fazer PIX, TED, saques). Diferença crucial: no roubo, o agente toma o bem. Na extorsão, a vítima é forçada a fazer o ato patrimonial. Aqui Joaquim fez as transferências — é extorsão. E a privação de liberdade como meio para isso = art. 158, §3º. Se a liberdade fosse a moeda de troca do resgate, aí seria extorsão mediante sequestro (art. 159)."},
  {"num":6,"exame":"XXXVIII Exame — 2023","titulo":"Receptação e Indícios da Origem Ilícita","enunciado":"João foi abordado pela Polícia Militar dirigindo um Porsche Cayenne avaliado em R$ 400.000,00. Na fiscalização, constatou-se que: o veículo era produto de roubo; o CRLV apresentado era falso. João afirmou que adquiriu o automóvel por R$ 35.000,00 e alegou desconhecer a origem ilícita do bem.","comando":"Assinale a opção correta.","gabarito":"A","alt":{"A":"A aquisição por preço muito inferior ao valor de mercado configura indício da prática de receptação.","B":"O crime de receptação impõe inversão do ônus da prova à defesa.","C":"O uso de documento materialmente falso dispensa perícia.","D":"O processo deve ser desmembrado em razão da suspensão condicional do processo aplicável à receptação."},"fb":{"A":"Preço muito inferior ao valor de mercado (R$ 35 mil por um carro de R$ 400 mil) é indício fortíssimo de que João sabia ou deveria saber da origem ilícita do bem. A jurisprudência consolida o preço vil como elemento indicativo do dolo na receptação.","B":"Em processo penal não há inversão do ônus da prova. O princípio constitucional da presunção de inocência (art. 5º, LVII, CF) garante que a prova incumbe à acusação.","C":"Falsificação material de documento normalmente exige exame pericial para comprovação técnica da adulteração.","D":"A suspensão condicional do processo (art. 89, Lei 9.099/95) exige pena mínima não superior a 1 ano. Desde a Lei 15.397/2026, a receptação simples tem pena de 2 a 6 anos — nem sozinha ela admite mais o benefício. Somada ao uso de documento falso (CRLV é documento público: pena de 2 a 6 anos), o benefício fica ainda mais distante."},"fund":"Art. 180, CP: receptação. Jurisprudência STJ/STF: preço vil é forte indício do dolo na receptação. Art. 5º, LVII, CF: presunção de inocência — o ônus probatório é da acusação. Falsidade material: perícia em regra necessária.<br><br><b>⚠ Nota de revisão (set/2026):</b> Pela Lei 15.397/2026, a pena da receptação simples (art. 180, caput) passou de 1 a 4 anos para 2 a 6 anos.","caqui":"Comprar um Porsche de R$ 400 mil por R$ 35 mil sem desconfiar de nada? Difícil engolir. A jurisprudência usa o preço vil como indício do dolo — não como prova absoluta, mas como elemento que fragiliza a tese de boa-fé. Atenção: não é inversão do ônus da prova (isso seria inconstitucional em matéria penal). É apenas um indício que a acusação usa."},
  {"num":7,"exame":"XXXVII Exame — 2023","titulo":"Furto Qualificado Mediante Fraude","enunciado":"Eduardo trabalha como porteiro de condomínio e possui um primo, Ygor, fisicamente muito parecido com ele. Certa noite, aproveitando-se da semelhança física e usando uniforme idêntico ao do porteiro, Ygor ingressou no edifício e subtraiu diversos pacotes dos moradores. Os moradores acreditaram que se tratava do verdadeiro porteiro organizando encomendas.","comando":"Assinale a alternativa correta.","gabarito":"A","alt":{"A":"Furto qualificado mediante fraude.","B":"Estelionato.","C":"Falsa identidade.","D":"Furto qualificado por abuso de confiança."},"fb":{"A":"Art. 155, §4º, II, CP: furto qualificado mediante fraude. Ygor usou ardil (disfarce + uniforme) para diminuir a vigilância das vítimas e facilitar a subtração. A fraude diminuiu a vigilância — os moradores acreditaram ser o porteiro. Isso é furto mediante fraude, não estelionato.","B":"No estelionato, a vítima entrega voluntariamente o bem induzida em erro. Aqui os moradores não entregaram nada conscientemente — Ygor subtraiu os pacotes que eles deixaram.","C":"Falsa identidade (art. 307, CP) é crime autônomo, mas no caso é absorvida pelo crime patrimonial principal.","D":"Abuso de confiança exige vínculo prévio de confiança legítima entre agente e vítima. Ygor não tinha nenhuma relação de confiança com os moradores — apenas fingiu ser o porteiro."},"fund":"Art. 155, §4º, II, CP: furto qualificado quando empregada fraude. Distinção furto mediante fraude vs. estelionato: no furto, a fraude diminui a vigilância e o agente subtrai; no estelionato, a vítima é induzida a entregar voluntariamente o bem.","caqui":"A diferença que cai toda hora: furto mediante fraude = fraude serve para distrair/enganar e o agente subtrai. Estelionato = a vítima acredita e entrega o bem por vontade própria (ainda que enganada). Aqui os moradores não entregaram nada — Ygor pegou enquanto eles pensavam ser o porteiro. A fraude (disfarce) diminuiu a vigilância = furto qualificado mediante fraude."},
  {"num":8,"exame":"XXXVII Exame — 2023","titulo":"Consumação do Roubo","enunciado":"Silvio, mediante ameaça de esquartejá-la com sua espada, arrancou o cordão de ouro do pescoço de Ana. Logo após a subtração: foi perseguido; preso em flagrante; o bem foi recuperado.","comando":"Assinale a alternativa correta.","gabarito":"D","alt":{"A":"Extorsão tentada.","B":"Roubo tentado.","C":"Roubo impróprio.","D":"Roubo consumado."},"fb":{"A":"Extorsão exige que a vítima realize o ato patrimonial coagida. Aqui foi Silvio quem arrancou o cordão — é roubo.","B":"Houve subtração consumada — Silvio chegou a ter a posse do bem, ainda que por brevíssimo tempo.","C":"Roubo impróprio (art. 157, §1º) ocorre quando a violência/ameaça é empregada APÓS a subtração, para assegurar posse ou impunidade. Aqui a ameaça foi antes/durante a subtração.","D":"Jurisprudência consolidada STF/STJ: roubo consuma-se com a inversão da posse da coisa, ainda que por brevíssimo tempo e sem posse mansa e pacífica. A perseguição imediata, a prisão e a recuperação do bem NÃO descaracterizam a consumação."},"fund":"Art. 157, CP. Teoria da amotio (adotada pelo STF/STJ para furto e roubo): consumação ocorre com a inversão da posse — basta que o agente tenha a coisa sob seu poder, ainda que por instante. Recuperação posterior não retroage para tornar o crime tentado.","caqui":"Consumação do roubo e do furto: pegou o bem com violência/ameaça = consumou. Não precisa de posse mansa e pacífica, não precisa sair do local, não precisa escapar. A teoria adotada no Brasil (amotio) diz que basta a inversão da posse — o bem saiu do domínio da vítima e entrou no do agente, mesmo que por segundos. Perseguição e recuperação são pós-consumação."},
  {"num":9,"exame":"XXXVI Exame — 2022","titulo":"Estelionato Tentado","enunciado":"Américo queria comprar ingressos para jogo de seu clube. André, querendo se vingar, ofereceu ingressos falsos a Américo. Antes de efetuar o pagamento, Américo percebeu a falsidade dos ingressos.","comando":"Assinale a alternativa correta.","gabarito":"C","alt":{"A":"Cambismo do Estatuto do Torcedor, na modalidade tentada.","B":"Falsificação de documento público.","C":"Estelionato, na modalidade tentada.","D":"Uso de documento falso."},"fb":{"A":"Cambismo envolve venda irregular de ingressos em si (especulação), não fraude mediante ingresso falso.","B":"Ingresso de evento esportivo é documento particular — não há falsificação de documento público.","C":"André criou fraude (ingressos falsos) para obter vantagem patrimonial (pagamento) — estelionato. Américo percebeu a fraude antes de pagar — não houve vantagem ilícita obtida. Crime não se consumou por circunstância alheia à vontade de André = estelionato tentado.","D":"Uso de documento falso pressupõe utilização do documento falso para finalidade própria. Aqui a questão central é a fraude patrimonial — e o falso é absorvido pelo estelionato (ou pela tentativa)."},"fund":"Art. 171, CP: estelionato — obter vantagem ilícita em prejuízo alheio, induzindo ou mantendo alguém em erro mediante fraude. Art. 14, II, CP: tentativa — crime não consumado por circunstâncias alheias à vontade do agente. Ingressos = documentos particulares.","caqui":"Estelionato = fraude para obter vantagem patrimonial. Aqui André usou ingressos falsos para tentar enganar Américo e receber o dinheiro. Como Américo percebeu antes de pagar, não houve vantagem obtida — estelionato tentado. A banca coloca uso de documento falso como distrator, mas o crime-fim aqui é patrimonial = absorve o falso."},
  {"num":10,"exame":"XXXIV Exame — 2022","titulo":"Concurso de Pessoas no Furto — Vínculo Subjetivo","enunciado":"Gabriel soube que Ricardo pretendia furtar a loja em que ele trabalhava. Com intenção de facilitar o crime, Gabriel: deixou o portão aberto; desligou os alarmes; tudo sem que Ricardo soubesse. Ricardo entrou no estabelecimento e furtou diversos bens. Após investigação: Ricardo faleceu; Gabriel foi identificado.","comando":"Assinale a alternativa correta.","gabarito":"B","alt":{"A":"Furto qualificado pelo concurso de pessoas.","B":"Furto simples, sem qualificadora do concurso de pessoas por ausência de elemento subjetivo.","C":"Furto simples, sem qualificadora do concurso de pessoas porque a contribuição foi inócua.","D":"Favorecimento real, mas não furto."},"fb":{"A":"A qualificadora do concurso de pessoas exige consciência recíproca da atuação conjunta — Ricardo não sabia da colaboração de Gabriel.","B":"Gabriel responde pelo furto como partícipe: para a participação, basta o liame subjetivo unilateral — o partícipe adere à conduta do autor, ainda que este não saiba da ajuda (doutrina majoritária). O que fica afastado é a QUALIFICADORA do concurso de pessoas (art. 155, §4º, IV), que exige a atuação conjunta com consciência recíproca entre os agentes. Como Ricardo não sabia da colaboração, a qualificadora não incide: furto simples.","C":"A contribuição de Gabriel foi eficaz e causalmente relevante — sem ele, Ricardo teria mais dificuldade para entrar. Não se trata de contribuição inócua.","D":"Favorecimento real (art. 349, CP) ocorre após a consumação do crime. Gabriel agiu antes e durante o furto — é participação no crime, não favorecimento posterior."},"fund":"Art. 29, CP: quem, de qualquer modo, concorre para o crime incide nas penas a este cominadas. Liame subjetivo: basta a adesão do partícipe à conduta do autor (unilateral), sem necessidade de acordo prévio. Art. 155, §4º, IV, CP: a qualificadora do concurso de pessoas exige atuação conjunta com consciência recíproca — ausente no caso.","caqui":"Separe duas perguntas: (1) Gabriel responde pelo furto? SIM — ele aderiu à conduta de Ricardo e contribuiu causalmente; para ser partícipe basta essa adesão, mesmo que Ricardo não saiba. (2) Incide a qualificadora do concurso de pessoas? NÃO — ela exige que os agentes atuem juntos sabendo um do outro. Resultado: furto simples. E não é favorecimento real — este vem depois do crime, não antes."},
  {"num":11,"exame":"XXXIII Exame — 2021","titulo":"Participação em Roubo e Favorecimento Real","enunciado":"João e Carlos pretendiam praticar roubo de carga. Paulo recusou participar diretamente da execução, mas ofereceu previamente sua garagem para esconder a carga roubada, sendo essa colaboração fundamental para viabilizar o crime. Após o roubo, Paulo desistiu de disponibilizar o local. Então João e Carlos procuraram Pedro, já após a prática do crime, e este cedeu sua garagem para guardar os bens.","comando":"Assinale a alternativa correta.","gabarito":"C","alt":{"A":"Ambos poderão responder por roubo majorado.","B":"Paulo responde por roubo majorado; Pedro apenas por receptação.","C":"Paulo responde por roubo majorado; Pedro apenas por favorecimento real.","D":"Paulo e Pedro respondem por favorecimento real."},"fb":{"A":"Pedro não participou previamente do plano — só auxiliou depois da consumação. Não responde pelo roubo.","B":"Pedro não é receptador porque sua conduta visou ajudar os próprios autores do roubo a guardar o produto do crime — isso é favorecimento real. A receptação ocorre quando o agente adquire, recebe ou oculta o bem em proveito próprio ou de terceiro que não seja o autor do crime anterior.","C":"Paulo: aderiu previamente ao plano, sua contribuição (garagem) foi fundamental — é partícipe do roubo. O fato de ter desistido de disponibilizar a garagem depois não apaga a participação anterior que já viabilizou o crime. Responde pelo roubo majorado. Pedro: só entrou em cena após o roubo, cedeu local para ajudar os autores sem proveito próprio = favorecimento real (art. 349, CP).","D":"Paulo não é favorecedor — é partícipe do roubo, pois sua contribuição foi prévia e essencial."},"fund":"Art. 29, CP: participação — contribuição prévia e causal para o crime. Art. 349, CP: favorecimento real — prestar ao criminoso, fora dos casos de coautoria ou de receptação, auxílio destinado a tornar seguro o proveito do crime. Art. 180, CP: receptação — em proveito próprio ou alheio (de terceiro que não o autor do crime antecedente).","caqui":"A linha do tempo é tudo aqui: Paulo contribuiu ANTES = participa do roubo. Pedro contribuiu DEPOIS = favorecimento real. E por que Pedro não é receptador? Porque o auxílio dele foi para beneficiar os PRÓPRIOS autores do roubo (guardar a carga deles). Receptação é quando o agente fica com o bem para si ou para um terceiro que não é o ladrão (art. 180: 'em proveito próprio ou alheio')."},
  {"num":12,"exame":"XXXII Exame — 2021","titulo":"Participação no Furto e Absorção da Receptação","enunciado":"Paulo, comerciante de veículos usados, encomendou a Júlio e Felipe a subtração de um veículo Audi Q7 para posterior revenda a cliente interessado. Após o furto: Paulo adquiriu o veículo; revendeu ao cliente; foi denunciado por furto qualificado e receptação qualificada em concurso material.","comando":"Assinale a alternativa correta.","gabarito":"C","alt":{"A":"Receptação simples e furto qualificado em concurso material.","B":"Receptação qualificada, apenas.","C":"Furto qualificado, apenas.","D":"Receptação simples, apenas."},"fb":{"A":"Não há concurso — quem participa do furto não recepta o mesmo bem.","B":"Paulo participou do furto desde o início — não pode ser apenas receptador do crime que ajudou a planejar.","C":"Paulo encomendou o furto, garantiu a compra prévia e viabilizou a execução — é partícipe/coautor do furto qualificado (concurso de pessoas). Quem participa do crime antecedente NÃO responde também por receptação do mesmo bem — isso seria bis in idem. A posse posterior do produto do crime que ajudou a executar é absorvida pela participação no furto.","D":"Paulo não foi mero adquirente posterior — participou do planejamento."},"fund":"Art. 155, §4º, IV, CP: furto qualificado pelo concurso de pessoas. Art. 180, CP: receptação. Princípio da consunção: quem participa do furto não responde também por receptação do mesmo bem — o crime mais grave (furto qualificado com participação) absorve o menos grave.","caqui":"Quem ajuda a planejar o furto não pode ser condenado também por receptar o produto do mesmo furto — seria punir duas vezes pelo mesmo fato. Paulo encomendou o carro, garantiu a compra, viabilizou o crime = participou do furto. Ponto final. A posse do carro depois é mero desdobramento da participação. Responde só pelo furto qualificado."},
  {"num":13,"exame":"XXXI Exame — 2020","titulo":"Furto Simples e Embriaguez Preordenada","enunciado":"Lúcio, embriagado, aproveitou-se de vítima dormindo em ônibus coletivo para subtrair seu celular. Foi denunciado e condenado por: furto qualificado pela destreza; com agravante da embriaguez preordenada.","comando":"Assinale a alternativa correta.","gabarito":"C","alt":{"A":"Reconhecimento de diminuição de pena pela embriaguez, sem afastamento da destreza.","B":"Desclassificação para furto simples, sem afastamento da agravante.","C":"Desclassificação para furto simples e afastamento da agravante.","D":"Absolvição por ausência de culpabilidade decorrente da embriaguez completa."},"fb":{"A":"Embriaguez voluntária não gera diminuição de pena (art. 28, II, CP — actio libera in causa).","B":"A agravante da embriaguez preordenada (art. 61, II, l, CP) exige que o agente se embriague para cometer o crime. Aqui não há prova disso — deve ser afastada também.","C":"Destreza exige habilidade especial — técnica refinada que torna a subtração imperceptível. Vítima dormindo: qualquer pessoa poderia pegar o celular sem habilidade especial. Sem destreza = furto simples. Embriaguez preordenada (agravante): exige que o agente beba para cometer o crime. Aqui Lúcio estava embriagado, mas sem prova de que bebeu com essa finalidade = agravante afastada.","D":"Embriaguez voluntária não exclui culpabilidade (art. 28, II, CP)."},"fund":"Art. 155, §4º, II, CP: destreza = habilidade especial na subtração. Jurisprudência: vítima dormindo não exige destreza. Art. 61, II, l, CP: agravante da embriaguez preordenada = embriagou-se para cometer o crime. Art. 28, II, CP: embriaguez voluntária não exclui imputabilidade.","caqui":"Duas qualificadoras/agravantes que a banca testa juntas: DESTREZA: exige habilidade especial, mão leve. Vítima dormindo = qualquer um pega sem habilidade. Sem destreza. EMBRIAGUEZ PREORDENADA: só é agravante quando o agente bebe PARA cometer o crime. Lúcio estava bêbado, mas não há prova de que bebeu com esse objetivo. Afasta a agravante. Resultado: furto simples, sem agravante."},
  {"num":14,"exame":"XXXI Exame — 2020","titulo":"Estelionato Tentado e Absorção do Falso","enunciado":"Maria tentou comprar roupas em loja de departamento utilizando cheque furtado de terceira pessoa, assinando como se fosse a titular da conta. O caixa desconfiou da situação e, após consulta bancária, constatou que o cheque era furtado. Maria foi denunciada por: estelionato; falsificação de documento público; em concurso material.","comando":"Assinale a alternativa correta.","gabarito":"D","alt":{"A":"Concurso formal entre estelionato consumado e falsificação de documento público.","B":"Concurso formal entre estelionato tentado e falsificação de documento particular.","C":"Crime único de estelionato consumado.","D":"Crime único de estelionato tentado."},"fb":{"A":"O estelionato não se consumou — Maria não obteve a vantagem. E cheque é documento PARTICULAR, não público.","B":"Embora a qualificação do estelionato como tentado seja correta, não há concurso formal — o falso é absorvido pelo estelionato (Súmula 17 do STJ).","C":"Não houve obtenção de vantagem — o crime não se consumou.","D":"Maria usou fraude para tentar obter vantagem patrimonial = estelionato. O caixa percebeu = crime não se consumou = estelionato tentado. Cheque = documento PARTICULAR (não público). A assinatura falsa serviu apenas como meio para o estelionato = Súmula 17 STJ: o falso que se exaure no estelionato, sem mais potencialidade lesiva, é por ele absorvido. Crime único = estelionato tentado."},"fund":"Art. 171, CP: estelionato. Súmula 17 STJ: quando o falso se exaure no estelionato, sem mais potencialidade lesiva, é por este absorvido. Cheque = documento particular (não público). Art. 14, II, CP: tentativa.","caqui":"Duas pegadinhas clássicas aqui: (1) Cheque é documento PARTICULAR, não público — a banca adora trocar isso. (2) Súmula 17 STJ: se o falso foi apenas meio para o estelionato e não tem potencialidade lesiva própria além disso, o estelionato absorve o falso. Um crime só: estelionato tentado."},
  {"num":15,"exame":"XXX Exame — 2019","titulo":"Furto Qualificado pelo Abuso de Confiança e Crime Continuado","enunciado":"Mário trabalhava como jardineiro da residência de Joaquim e possuía livre acesso à casa em razão da confiança conquistada. Utilizando o cartão bancário do patrão e conhecendo sua senha: realizou saque de R$ 1.000,00; no dia seguinte tentou novo saque; não conseguiu porque o cartão já estava bloqueado.","comando":"Assinale a alternativa correta.","gabarito":"B","alt":{"A":"Furto simples consumado e furto simples tentado, em continuidade delitiva.","B":"Furto qualificado pelo abuso de confiança consumado e tentado, em continuidade delitiva.","C":"Um único furto qualificado consumado.","D":"Furto qualificado consumado e tentado, em concurso material."},"fb":{"A":"Mário usou a relação de confiança para acessar o cartão e senha — há abuso de confiança, qualificando o furto.","B":"Mário tinha livre acesso e confiança do patrão — usou isso para furtar = abuso de confiança (art. 155, §4º, II, CP). Primeiro saque: consumado. Segundo saque: tentado (cartão bloqueado = circunstância alheia à vontade). Mesmas condições de tempo, local e modo de execução = crime continuado (art. 71, CP).","C":"Houve dois episódios distintos — consumado e tentado.","D":"As condições de tempo, local e modo são semelhantes = crime continuado, não concurso material."},"fund":"Art. 155, §4º, II, CP: furto qualificado pelo abuso de confiança. Art. 71, CP: crime continuado — crimes subsequentes praticados nas mesmas condições de tempo, lugar, modo de execução e outras semelhantes, devendo ser considerados como continuação do primeiro.","caqui":"Abuso de confiança: o agente usa a relação de confiança que tem com a vítima para furtar mais facilmente. Mário tinha acesso especial e conhecia a senha — é abuso de confiança. Dois saques = dois crimes qualificados. Mesmo contexto, mesmo modo, sequência temporal próxima = crime continuado (não concurso material). O crime continuado beneficia o réu — aplica-se a pena de um só, aumentada."},
  {"num":16,"exame":"XXIX Exame — 2019","titulo":"Tempo do Crime e Extorsão Mediante Sequestro","enunciado":"Lúcio sequestrou Danilo em 05/10/2018, quando ainda era menor de idade. Seu aniversário de 18 anos ocorreu em 09/10/2018. A vítima permaneceu em cativeiro por duas semanas, período durante o qual os sequestradores exigiam resgate da família. A polícia libertou a vítima e apreendeu Lúcio após ele já ter atingido a maioridade penal.","comando":"Assinale a alternativa correta.","gabarito":"C","alt":{"A":"Não pode haver denúncia porque o Código Penal adota a teoria da ação para definição do tempo do crime, sendo Lúcio inimputável.","B":"Não pode haver denúncia porque o Código Penal adota a teoria do resultado.","C":"Lúcio responde por extorsão mediante sequestro qualificada consumada, como imputável.","D":"Lúcio responde por extorsão mediante sequestro tentada."},"fb":{"A":"Embora o CP adote a teoria da atividade para o tempo do crime (art. 4º), a extorsão mediante sequestro é crime permanente — sua consumação se prolonga enquanto dura o cativeiro. Quando Lúcio atingiu 18 anos, o crime ainda estava em execução.","B":"O CP adota a teoria da atividade para o tempo do crime (art. 4º) — não do resultado. Mas isso não resolve o caso, que envolve crime permanente.","C":"Extorsão mediante sequestro é crime permanente — a consumação se prolonga enquanto durar o sequestro. Durante a permanência, quando Lúcio atingiu a maioridade, passou a ser imputável. Nos crimes permanentes, aplica-se a lei vigente durante toda a execução. Súmula 711, STF: a lei penal mais grave aplica-se ao crime continuado ou ao crime permanente, se a sua vigência é anterior à cessação da continuidade ou permanência.","D":"A extorsão mediante sequestro consuma-se com a privação da liberdade + finalidade de obtenção de resgate. Não é necessário o efetivo pagamento. Crime consumado."},"fund":"Art. 4º, CP: teoria da atividade — tempo do crime é o da ação ou omissão. Art. 159, CP: extorsão mediante sequestro — crime permanente. Súmula 711, STF: aplica-se a lei mais grave ao crime permanente vigente antes da cessação da permanência. Ao atingir a maioridade durante a permanência, Lúcio torna-se imputável.","caqui":"Crime permanente: a consumação não é um instante, é um período — enquanto dura o sequestro, o crime está acontecendo. Quando Lúcio fez 18 anos no dia 09/10, o sequestro ainda estava em curso. Passou a ser imputável. Nos crimes permanentes, a lei do momento conta enquanto o crime continua. Súmula 711 STF: se lei mais grave entrou em vigor antes de cessar a permanência, aplica-se. Aqui a situação análoga: atingiu maioridade durante a permanência = responde como imputável."},
  {"num":17,"exame":"XXVII Exame — 2018","titulo":"Escusa Absolutória nos Crimes Patrimoniais","enunciado":"Leonardo e João praticaram furto do celular de Gustavo. Gustavo é: pai de Leonardo; sem qualquer vínculo familiar com João. João sabia dessa relação familiar. O juiz reconheceu causa de isenção de pena para ambos.","comando":"Assinale a alternativa correta.","gabarito":"C","alt":{"A":"Ambos fazem jus à escusa absolutória.","B":"Nenhum faz jus à escusa absolutória.","C":"Apenas Leonardo faz jus à escusa absolutória.","D":"Apenas João faz jus à escusa absolutória."},"fb":{"A":"A escusa absolutória é circunstância de caráter pessoal — não se comunica ao coautor/partícipe que não possui o vínculo familiar.","B":"Leonardo possui o vínculo familiar com a vítima (pai) — faz jus à escusa.","C":"Art. 181, II, CP: é isento de pena quem comete crime patrimonial em prejuízo de ascendente ou descendente. Leonardo furtou o pai = escusa absolutória. Art. 183, CP c/c art. 30, CP: as circunstâncias de caráter pessoal (relação familiar) NÃO se comunicam ao coautor/partícipe. João não tem vínculo familiar com Gustavo = responde normalmente pelo furto.","D":"João não tem nenhum vínculo familiar com a vítima."},"fund":"Art. 181, II, CP: isenção de pena nos crimes patrimoniais entre ascendentes e descendentes. Art. 183, CP: exceções à escusa absolutória. Art. 30, CP: as circunstâncias de caráter pessoal não se comunicam, salvo quando elementares do crime.","caqui":"Escusa absolutória é pessoal e intransferível. O benefício é porque o Direito prefere não punir o filho que furtou o pai — preservar a família. Mas esse benefício não passa para quem não tem a relação familiar. João não é filho de Gustavo = João responde pelo furto normalmente. E atenção: o juiz errou ao estender a isenção para João — a questão cobra quem realmente faz jus."},
  {"num":18,"exame":"XXV Exame — 2018","titulo":"Furto Qualificado e Cárcere Privado","enunciado":"Flávia e Luiza prenderam Paulo dentro do banheiro da própria residência colocando um pedaço de madeira na fechadura. Enquanto Paulo permanecia impossibilitado de sair e reagir, elas subtraíram diversos bens da casa.","comando":"Assinale a alternativa correta.","gabarito":"D","alt":{"A":"Roubo majorado.","B":"Furto qualificado, apenas.","C":"Cárcere privado, apenas.","D":"Furto qualificado e cárcere privado."},"fb":{"A":"Roubo exige violência ou grave ameaça direta contra a vítima. Aqui não houve ameaça verbal nem agressão física direta — Paulo foi trancado sem contato de força ou ameaça explícita.","B":"Houve também privação ilícita da liberdade de Paulo — cárcere privado autônomo.","C":"Houve também subtração patrimonial — não apenas a privação da liberdade.","D":"Segundo o gabarito oficial: O trancamento de Paulo no banheiro = cárcere privado (art. 148, CP). A subtração dos bens por Flávia e Luiza = furto qualificado pelo concurso de duas ou mais pessoas (art. 155, §4º, IV, CP). Os dois crimes atingem bens jurídicos distintos (liberdade + patrimônio)."},"fund":"Art. 155, §4º, IV, CP: furto qualificado mediante concurso de duas ou mais pessoas. Art. 148, CP: sequestro e cárcere privado. Art. 157, caput, CP: o roubo também abrange a subtração cometida 'depois de havê-la, por qualquer meio, reduzido à impossibilidade de resistência' (violência imprópria).<br><br><b>⚠ Nota de revisão (set/2026):</b> Parte da doutrina enquadraria o caso como roubo com violência imprópria, já que a vítima foi reduzida à impossibilidade de resistência para a subtração. Mantido o gabarito D — confira o gabarito oficial do XXV Exame.","caqui":"Por que não é roubo, segundo o gabarito? Porque não houve violência física nem grave ameaça direta contra Paulo. Mas também não é só furto — tem o cárcere privado autônomo (privação da liberdade). E o furto é qualificado porque foi cometido por duas pessoas (Flávia e Luiza — art. 155, §4º, IV). Atenção: 'recurso que dificultou a defesa da vítima' NÃO é qualificadora de furto (isso é do homicídio)."},
  {"num":19,"exame":"XXIV Exame — 2017","titulo":"Furto Simples e Arrependimento Posterior","enunciado":"João pretendia furtar a residência do vizinho e, para isso, pediu a Pablo, chaveiro, uma chave destinada ao ingresso no imóvel. No dia do crime: a porta já estava aberta; João não utilizou a chave; ingressou normalmente e subtraiu uma TV. Depois, convencido pela esposa: devolveu espontaneamente o bem; confessou os fatos à vítima.","comando":"Assinale a alternativa correta.","gabarito":"D","alt":{"A":"Nenhum responderá pelo crime em razão de arrependimento eficaz.","B":"Ambos responderão por furto qualificado, com redução apenas para João.","C":"Ambos responderão por furto qualificado, com redução para ambos.","D":"João responde por furto simples com arrependimento posterior, e Pablo não responde pelo crime patrimonial."},"fb":{"A":"Arrependimento eficaz ocorre antes da consumação. O furto já se consumou quando João subtraiu a TV — a devolução posterior é arrependimento posterior, não eficaz.","B":"A chave não foi usada — a qualificadora da chave falsa/escalada não incide. João responde por furto simples. Pablo: como a chave não foi usada, sua contribuição foi inócua = sem relevância causal = não responde pelo crime patrimonial.","C":"Não houve uso da chave — sem qualificadora. E Pablo não responde pelo crime.","D":"A chave não foi utilizada = sem qualificadora da chave falsa = furto simples. João devolveu após a consumação = arrependimento posterior (art. 16, CP) = redução de pena de 1/3 a 2/3. Pablo forneceu a chave que não foi usada = contribuição sem relevância causal = não responde pelo crime."},"fund":"Art. 155, CP: furto simples. Qualificadora da chave falsa: exige efetiva utilização da chave. Art. 16, CP: arrependimento posterior — restituição do bem ou reparação do dano antes do recebimento da denúncia, sem violência. Art. 29, CP: participação exige contribuição causal relevante.","caqui":"Três temas numa questão só: (1) Qualificadora da chave falsa: exige USO efetivo da chave. A porta estava aberta = chave não foi usada = sem qualificadora. (2) Arrependimento posterior: crime consumou + devolveu antes da denúncia = redução de pena (não isenção). (3) Pablo: forneceu chave que não foi usada = contribuição inócua = sem relevância causal = não responde pelo furto patrimonial."},
  {"num":20,"exame":"XXI Exame — 2016","titulo":"Participação Moral no Furto","enunciado":"Felipe desejava possuir determinado veículo e ajustou com Caio e Bruno que eles subtraíssem o automóvel para posterior entrega a ele, mediante pagamento. O furto foi efetivamente praticado, e Felipe ficou com o carro em sua casa de praia.","comando":"Assinale a alternativa correta.","gabarito":"C","alt":{"A":"Furto simples.","B":"Favorecimento real.","C":"Furto qualificado pelo concurso de agentes.","D":"Receptação."},"fb":{"A":"Há qualificadora do concurso de pessoas — e Felipe é partícipe do furto, não mero destinatário.","B":"Favorecimento real pressupõe auxílio posterior ao crime sem participação prévia. Felipe participou desde o início.","C":"Felipe encomendou o furto, combinou pagamento, garantiu a compra prévia — é partícipe moral/intelectual do furto. Há vínculo subjetivo + contribuição causal relevante + concurso de pessoas. Qualificadora do concurso de agentes incide. Felipe responde pelo furto qualificado como partícipe.","D":"Receptador é quem adquire produto de crime que ele NÃO ajudou a cometer. Felipe ajudou a planejar e executar (indiretamente) — é partícipe do furto, não receptador."},"fund":"Art. 155, §4º, IV, CP: furto qualificado pelo concurso de pessoas. Art. 29, CP: participação — quem concorre para o crime, na medida de sua culpabilidade. Participação moral: instiga, manda ou garante resultado. Felipe encomendou = participou do furto.","caqui":"Felipe não executou o furto — mas encomendou, pagou, garantiu o resultado. Isso é participação moral no furto (instigação + auxílio). Quem manda fazer o crime é tão partícipe quanto quem executa. E como eram 3 (Felipe + Caio + Bruno), incide a qualificadora do concurso de pessoas. NÃO é receptação — receptador não participa do crime antecedente."},
  {"num":21,"exame":"XX Exame — 2016","titulo":"Concurso de Pessoas e Latrocínio","enunciado":"Silva e Pereira combinaram praticar um furto em residência. Silva não sabia que Pereira portava arma de fogo. Durante a execução: Silva subtraiu uma televisão; Pereira foi surpreendido por segurança; efetuou disparos; matou o segurança para garantir o crime.","comando":"Assinale a alternativa correta.","gabarito":"A","alt":{"A":"Silva responde por furto qualificado; Pereira por latrocínio.","B":"Ambos respondem por latrocínio, com diminuição de pena para Silva.","C":"Silva responde por furto qualificado; Pereira por furto qualificado e latrocínio em concurso.","D":"Ambos respondem por latrocínio consumado, sem redução."},"fb":{"A":"Art. 29, §2º, CP (cooperação dolosamente distinta): Silva quis participar de crime menos grave (furto) e não sabia da arma — recebe a pena do furto qualificado pelo concurso de pessoas, que pode ser aumentada até a metade se o resultado mais grave era previsível. Pereira, que matou o segurança para garantir o crime, responde por latrocínio (art. 157, §3º, II).","B":"Não existe 'latrocínio com diminuição de pena' para quem quis o crime menos grave. O art. 29, §2º, manda aplicar a pena do crime menos grave (furto), AUMENTADA até metade se o resultado mais grave era previsível.","C":"Pereira responde apenas por latrocínio — a subtração já integra o latrocínio, não havendo concurso com o furto.","D":"Silva não aderiu à violência nem sabia da arma — não responde por latrocínio (art. 29, §2º, CP)."},"fund":"Art. 157, §3º, II, CP: latrocínio (pena de 24 a 30 anos, Lei 15.397/2026). Art. 29, §2º, CP: se algum dos concorrentes quis participar de crime menos grave, ser-lhe-á aplicada a pena deste; essa pena será aumentada até metade, na hipótese de ter sido previsível o resultado mais grave.<br><br><b>⚠ Nota de revisão (set/2026):</b> O gabarito deste banco foi ajustado para a letra A, conforme o art. 29, §2º, do CP (a versão anterior indicava a B). Confira o gabarito oficial do XX Exame.","caqui":"Cooperação dolosamente distinta: cada um responde pelo crime a que aderiu. Silva combinou FURTO e não sabia da arma = responde por furto. Se a morte era previsível, a pena do furto sobe até metade — mas continua sendo furto. Pereira foi além e matou = latrocínio. Mesma lógica da questão do Moisés (Q3). Cuidado com a pegadinha: 'latrocínio com diminuição de pena' não existe no art. 29, §2º."},
  {"num":22,"exame":"XX Exame — 2016","titulo":"Latrocínio Após Furto Consumado","enunciado":"Francisco furtou diversas ferramentas de um sítio. No dia seguinte, ao ser abordado pelo proprietário Antônio, que reconheceu os bens subtraídos, Francisco desferiu golpe de pá na cabeça da vítima para garantir a impunidade do crime anterior, causando sua morte.","comando":"Assinale a alternativa correta.","gabarito":"D","alt":{"A":"Latrocínio consumado.","B":"Latrocínio tentado.","C":"Furto tentado e homicídio qualificado.","D":"Furto consumado e homicídio qualificado."},"fb":{"A":"Para haver latrocínio pela violência posterior à subtração (roubo impróprio + morte), a violência deve ser empregada LOGO DEPOIS de subtraída a coisa (art. 157, §1º, CP). Francisco agrediu Antônio no dia seguinte — rompida a imediatidade, não há roubo impróprio nem latrocínio.","B":"Não há latrocínio (a violência não foi 'logo depois' da subtração) e, de todo modo, a morte se consumou.","C":"O furto foi consumado no dia anterior, com a inversão da posse das ferramentas.","D":"O furto já estava consumado no dia anterior. A violência empregada no dia seguinte, sem imediatidade, não transforma o furto em roubo impróprio (art. 157, §1º, exige violência 'logo depois' da subtração). Francisco matou Antônio para assegurar a impunidade do crime anterior = homicídio qualificado pela conexão (art. 121, §2º, V, CP), em concurso material com o furto."},"fund":"Art. 155, CP: furto consumado. Art. 157, §1º, CP: roubo impróprio — violência ou grave ameaça empregada logo depois de subtraída a coisa, para assegurar a impunidade ou a detenção. Art. 121, §2º, V, CP: homicídio qualificado para assegurar a impunidade de outro crime.<br><br><b>⚠ Nota de revisão (set/2026):</b> O gabarito deste banco foi ajustado para a letra D, conforme o art. 157, §1º, do CP (a versão anterior indicava a A). Confira o gabarito oficial do XX Exame.","caqui":"O relógio decide: violência LOGO DEPOIS da subtração, para garantir o bem ou a impunidade = roubo impróprio (e, com morte, latrocínio). Violência NO DIA SEGUINTE = já não há imediatidade. Aí são dois crimes: o furto (consumado ontem) + homicídio qualificado para assegurar a impunidade (art. 121, §2º, V). Guarde: 'logo depois' é a palavra-chave do §1º do art. 157."},
  {"num":23,"exame":"XIX Exame — 2016","titulo":"Favorecimento Real x Receptação","enunciado":"Após um roubo de carga, os autores pediram a Paulo que guardasse os bens roubados em seu galpão por 24 horas. Paulo sabia da origem ilícita da carga e aceitou armazená-la temporariamente para auxiliar os criminosos.","comando":"Assinale a alternativa correta.","gabarito":"D","alt":{"A":"Receptação.","B":"Receptação qualificada.","C":"Roubo majorado.","D":"Favorecimento real."},"fb":{"A":"Paulo não é receptador porque guardou a carga para ajudar os próprios autores do roubo a assegurar o proveito do crime — isso é favorecimento real (art. 349). A receptação é em proveito próprio ou de terceiro que não seja o autor do crime antecedente.","B":"Receptação qualificada (art. 180, §1º) exige que a conduta seja praticada no exercício de atividade comercial ou industrial — e, de qualquer forma, Paulo agiu para ajudar os autores, o que caracteriza favorecimento real.","C":"Paulo não participou do roubo — só auxiliou depois da consumação.","D":"Art. 349, CP: favorecimento real — prestar a criminoso, fora dos casos de coautoria ou de receptação, auxílio destinado a tornar seguro o proveito do crime. Paulo guardou os bens para ajudar os autores do roubo = favorecimento real."},"fund":"Art. 349, CP: favorecimento real — auxílio posterior ao crime, prestado ao próprio criminoso, para tornar seguro o proveito do crime. Art. 180, CP: receptação — adquirir, receber, transportar, conduzir ou ocultar, em proveito próprio ou alheio, coisa que sabe ser produto de crime. A diferença fundamental: favorecimento real = beneficia o AUTOR do crime. Receptação = beneficia o agente ou um terceiro que NÃO é o autor.","caqui":"A distinção entre favorecimento real e receptação é: A QUEM o auxílio beneficia. Paulo guardou os bens para ajudar os próprios ladrões = favorecimento real. Se Paulo tivesse comprado a carga para si, ou guardado para um terceiro comprador que não participou do roubo = receptação (art. 180: 'em proveito próprio ou alheio'). Na prova: ajuda ao próprio criminoso = favorecimento real."},
  {"num":24,"exame":"XVII Exame — 2015","titulo":"Escusa Absolutória e Furto Qualificado","enunciado":"Marcondes, precisando de dinheiro, arrombou o açougue de propriedade de seu pai e subtraiu R$ 1.000,00 do caixa. A vítima: era seu pai; tinha 63 anos de idade.","comando":"Assinale a alternativa correta.","gabarito":"C","alt":{"A":"Marcondes é isento de pena pela escusa absolutória.","B":"Marcondes responde por furto de coisa comum.","C":"Marcondes responde por furto qualificado.","D":"Marcondes responde por dano e furto simples em concurso formal."},"fb":{"A":"Art. 183, III, CP: a escusa absolutória NÃO se aplica quando a vítima tem 60 anos ou mais. O pai de Marcondes tinha 63 anos = sem isenção de pena.","B":"Furto de coisa comum (art. 156, CP) é subtração de coisa comum que também pertence ao agente. Aqui o dinheiro pertencia ao pai.","C":"Marcondes arrombou o estabelecimento (rompimento de obstáculo = qualificadora, art. 155, §4º, I, CP). Além disso, a vítima tinha mais de 60 anos = afastada a escusa absolutória (art. 183, III, CP). Responde por furto qualificado.","D":"O dano causado pelo arrombamento é absorvido pela qualificadora do furto (rompimento de obstáculo)."},"fund":"Art. 155, §4º, I, CP: furto qualificado por destruição ou rompimento de obstáculo. Art. 181, II, CP: escusa absolutória entre ascendentes e descendentes. Art. 183, III, CP: a escusa absolutória não se aplica quando a vítima tem 60 anos ou mais. Dano absorvido pela qualificadora.","caqui":"Dupla pegadinha: (1) Parece que a escusa absolutória se aplica — filho furtou o pai. Mas não se aplica porque o pai tem 63 anos = vítima idosa = art. 183, III, CP afasta a escusa. (2) Arrombou o açougue = rompimento de obstáculo = qualificadora. O dano causado pelo arrombamento não é crime autônomo — é absorvido pela qualificadora. Resultado: furto qualificado."},
  {"num":25,"exame":"XVI Exame — 2015","titulo":"Roubo e Suspensão Condicional da Pena — Sursis para Maiores de 70 Anos","enunciado":"Moura, maior de 70 anos, mediante grave ameaça, subtraiu relógio avaliado em R$ 550,00. O bem foi recuperado 45 minutos depois e a vítima não sofreu prejuízo patrimonial. Moura: confessou o fato; era primário; tinha bons antecedentes; foi condenado a 4 anos de reclusão em regime aberto.","comando":"Assinale a alternativa correta.","gabarito":"B","alt":{"A":"Reconhecimento da tentativa.","B":"Aplicação do sursis.","C":"Reconhecimento da insignificância.","D":"Redução da pena abaixo do mínimo legal pelas atenuantes."},"fb":{"A":"O roubo se consumou com a inversão da posse — a recuperação posterior do bem não retroage para tornar o crime tentado.","B":"Art. 77, §2º, CP: para condenados maiores de 70 anos, o sursis pode ser aplicado quando a pena não supera 4 anos. Moura foi condenado a exatamente 4 anos = cabe sursis.","C":"Princípio da insignificância não se aplica ao roubo — crime com violência/grave ameaça à pessoa, que tutela além do patrimônio a integridade física e psíquica da vítima.","D":"Súmula 231, STJ: as circunstâncias atenuantes não podem reduzir a pena abaixo do mínimo legal."},"fund":"Art. 77, §2º, CP: para maiores de 70 anos, o sursis pode ser aplicado quando a pena não supere 4 anos. Súmula 231, STJ: atenuantes não reduzem pena abaixo do mínimo. Princípio da insignificância: inaplicável ao roubo por sua natureza violenta.<br><br><b>⚠ Nota de revisão (set/2026):</b> Questão anterior à Lei 15.397/2026, que elevou a pena do roubo simples para 6 a 10 anos. Hoje, uma condenação a 4 anos por roubo consumado não seria possível; o raciocínio do sursis etário (art. 77, §2º: maior de 70 anos, pena não superior a 4 anos) continua válido.","caqui":"Três armadilhas numa questão: (1) Tentativa: não — roubo já consumou com a posse, mesmo que recuperada depois. (2) Insignificância: nunca no roubo — a grave ameaça viola a pessoa, não só o patrimônio. (3) Atenuante abaixo do mínimo: vedado pela Súmula 231 STJ. A resposta é sursis — e muita gente esquece que para maiores de 70 anos o limite sobe de 2 para 4 anos (art. 77, §2º, CP)."},
  {"num":26,"exame":"XV Exame — 2014","titulo":"Furto Qualificado-Privilegiado","enunciado":"No dia 14 de setembro de 2014, por volta das 20h, José, primário e de bons antecedentes, tentou subtrair para si, mediante escalada de um muro de 1,70 metros de altura, vários pedaços de fios duplos de cobre da rede elétrica avaliados em aproximadamente R$ 100,00 (cem reais) à época dos fatos.","comando":"Sobre o caso apresentado, segundo entendimento sumulado do STJ, assinale a afirmativa correta.","gabarito":"B","alt":{"A":"É possível o reconhecimento do furto qualificado privilegiado independentemente do preenchimento cumulativo dos requisitos previstos no art. 155, §2º, do CP.","B":"É possível o reconhecimento do privilégio previsto no art. 155, §2º, do CP nos casos de crime de furto qualificado se estiverem presentes a primariedade do agente e o pequeno valor da coisa, e se a qualificadora for de ordem objetiva.","C":"Não é possível o reconhecimento do privilégio previsto no art. 155, §2º, do CP nos casos de crime de furto qualificado, mesmo que estejam presentes a primariedade do agente e o pequeno valor da coisa.","D":"É possível o reconhecimento do privilégio previsto no art. 155, §2º, do CP nos casos de crime de furto qualificado se estiverem presentes a primariedade do agente, o pequeno valor da coisa, e se a qualificadora for de ordem subjetiva."},"fb":{"A":"Os requisitos do privilégio devem estar cumulativamente presentes (primariedade + pequeno valor + qualificadora objetiva).","B":"Súmula 511, STJ: é possível o reconhecimento do privilégio do §2º do art. 155, CP nos casos de furto qualificado, se estiverem presentes a primariedade do agente, o pequeno valor da coisa, e se a qualificadora for de ordem objetiva. Escalada = qualificadora objetiva. José é primário. Valor de R$ 100,00 = pequeno valor. Todos os requisitos presentes.","C":"A Súmula 511 STJ admite o furto qualificado-privilegiado quando preenchidos os requisitos.","D":"A exigência é qualificadora OBJETIVA — não subjetiva. Qualificadoras subjetivas (como abuso de confiança) não admitem o privilégio."},"fund":"Súmula 511, STJ: é possível o reconhecimento do privilégio previsto no §2º do art. 155 do CP nos casos de crime de furto qualificado, se estiverem presentes a primariedade do agente, o pequeno valor da coisa e a qualificadora for de ordem objetiva. Qualificadoras objetivas: escalada, rompimento de obstáculo, chave falsa, concurso de pessoas. Qualificadoras subjetivas: abuso de confiança.<br><br><b>⚠ Nota de revisão (set/2026):</b> Desde a Lei 15.181/2025, a subtração de fios, cabos ou equipamentos de energia elétrica, telefonia ou transferência de dados tem qualificadora própria (art. 155, §8º, pena de 2 a 8 anos). A Súmula 511 do STJ continua válida.","caqui":"Furto qualificado-privilegiado parece contradição — mas o STJ admite (Súmula 511). A fórmula: primário + coisa de pequeno valor + qualificadora objetiva = pode reconhecer o privilégio. Qualificadora objetiva = modo de execução (escalada, rompimento, chave falsa). Qualificadora subjetiva = relação com a vítima (abuso de confiança). Escalada é objetiva = entra na fórmula = furto qualificado-privilegiado possível."},
  {"num":27,"exame":"XII Exame — 2013","titulo":"Peculato-Furto e Concurso de Pessoas","enunciado":"Lucas, funcionário público do Tribunal de Justiça, e Laura, sua noiva, resolveram subtrair notebooks de última geração adquiridos pela serventia onde Lucas exerce suas funções. Lucas, valendo-se da facilidade que seu cargo lhe proporcionava, ingressou no prédio público, subtraiu os notebooks e os entregou pela janela a Laura, que os colocou no carro e saiu. Cerca de uma semana após, Laura e Lucas terminam o noivado. Muito enraivecida, Laura procura a polícia e noticia os fatos, ocasião em que devolve todos os notebooks subtraídos.","comando":"Com base nas informações do caso narrado, assinale a afirmativa correta.","gabarito":"A","alt":{"A":"Laura e Lucas devem responder pelo delito de peculato-furto praticado em concurso de agentes.","B":"Laura deve responder por furto qualificado e Lucas deve responder por peculato-furto, dada à incomunicabilidade das circunstâncias.","C":"Laura e Lucas serão beneficiados pela causa extintiva de punibilidade, uma vez que houve reparação do dano ao erário anteriormente à denúncia.","D":"Laura será beneficiada pelo instituto do arrependimento eficaz, mas Lucas não poderá valer-se de tal benefício, pois a restituição dos bens, por parte dele, não foi voluntária."},"fb":{"A":"Art. 312, §1º, CP: peculato-furto — o funcionário público subtrai bem da Administração valendo-se da facilidade do cargo. Art. 30, CP: as elementares do crime comunicam-se aos coautores/partícipes que delas tenham conhecimento. Laura sabia que Lucas era funcionário público = a condição funcional se comunica a ela = ambos respondem por peculato-furto.","B":"A condição de funcionário público é ELEMENTAR do peculato — comunica-se ao partícipe que sabe da situação. Laura sabia que Lucas trabalhava no TJ = comunicabilidade.","C":"Reparação do dano no peculato não extingue a punibilidade (diferente do peculato culposo). No peculato doloso, é circunstância de redução de pena, não extinção.","D":"Não houve arrependimento eficaz (crime já consumado). A devolução é posterior à consumação = arrependimento posterior, no máximo. E não extingue a punibilidade."},"fund":"Art. 312, §1º, CP: peculato-furto — funcionário público que subtrai valendo-se do cargo. Art. 30, CP: elementares do crime comunicam-se ao coautor/partícipe que as conhece. Condição de funcionário público = elementar do peculato = comunica-se a Laura.","caqui":"A condição de funcionário público é elementar do peculato — sem ela, o crime seria furto comum. Sendo elementar, comunica-se aos partícipes que a conhecem (art. 30, CP). Laura sabia que Lucas trabalhava no TJ = a elementar se comunica = Laura responde também por peculato. Compare com circunstância pessoal (como parentesco) = NÃO se comunica. Elementar = se comunica. Circunstância pessoal = não se comunica."},
  {"num":28,"exame":"VIII Exame — 2012","titulo":"Furto Qualificado pela Destreza e Consumação","enunciado":"Jaime, conhecido pelos colegas como Jaiminho mão de seda, utilizando-se de sua destreza, consegue retirar a carteira do bolso traseiro da calça de Ricardo que, ao perceber a subtração, sai ao encalço do delinquente. Ocorre que, durante a perseguição, Ricardo acaba sendo atropelado, vindo a falecer em decorrência dos ferimentos.","comando":"Com base nas informações apresentadas na hipótese, e a jurisprudência predominante dos tribunais superiores, assinale a afirmativa correta.","gabarito":"C","alt":{"A":"Jaime praticou delito de furto em sua modalidade tentada.","B":"Jaime consumou a prática do delito de furto simples.","C":"Jaime consumou a prática do delito de furto qualificado.","D":"Jaime consumou a prática de latrocínio."},"fb":{"A":"Houve consumação — Jaime chegou a ter a posse da carteira.","B":"A destreza (habilidade especial na subtração sem percepção imediata da vítima) qualifica o furto.","C":"Jaime usou técnica refinada (mão leve) para retirar a carteira do bolso sem que Ricardo percebesse imediatamente = destreza = furto qualificado (art. 155, §4º, II, CP). O furto foi consumado com a inversão da posse. Ricardo só percebeu depois — isso confirma a destreza. A morte de Ricardo durante a perseguição: foi por atropelamento (caso fortuito), sem violência praticada por Jaime. Sem violência de Jaime = sem latrocínio.","D":"Latrocínio exige que a violência letal seja praticada pelo agente. Aqui a morte ocorreu por atropelamento fortuito durante perseguição — Jaime não matou Ricardo."},"fund":"Art. 155, §4º, II, CP: furto qualificado pela destreza — habilidade especial que torna a subtração imperceptível para a vítima. Consumação: inversão da posse da coisa. Latrocínio: exige violência ou grave ameaça praticada pelo agente, vinculada à subtração.","caqui":"A destreza é uma habilidade especial — o jeito refinado de pegar sem ser percebido. Mão de seda = destreza = furto qualificado. O furto consumou quando Jaime pegou a carteira. Ricardo morreu durante a perseguição — por atropelamento, não por violência de Jaime. Sem violência de Jaime = sem latrocínio. Latrocínio exige que o AGENTE mate ou lesione gravemente."},
  {"num":29,"exame":"V Exame — 2011","titulo":"Princípio da Insignificância no Furto","enunciado":"Jefferson, segurança da mais famosa rede de supermercados do Brasil, percebeu que João escondera em suas vestes três sabonetes, de valor aproximado de R$ 12,00. Ao tentar sair do estabelecimento, entretanto, João é preso em flagrante delito pelo segurança, que chama a polícia.","comando":"A esse respeito, assinale a alternativa correta.","gabarito":"B","alt":{"A":"A conduta de João não constitui crime, uma vez que este agiu em estado de necessidade.","B":"A conduta de João não constitui crime, uma vez que o fato é materialmente atípico.","C":"A conduta de João constitui crime, uma vez que se enquadra no artigo 155 do Código Penal, não estando presente nenhuma das causas de exclusão de ilicitude ou culpabilidade, razão pela qual este deverá ser condenado.","D":"Embora sua conduta constitua crime, João deverá ser absolvido, uma vez que a prisão em flagrante é nula, por ter sido realizada por um segurança particular."},"fb":{"A":"Não há elementos configuradores de estado de necessidade — não há perigo atual a bem jurídico do agente.","B":"Princípio da insignificância (bagatela): afasta a tipicidade material quando a lesão ao bem jurídico é mínima. STF/STJ adotam 4 vetores: mínima ofensividade, nenhuma periculosidade social, reduzido grau de reprovabilidade, inexpressividade da lesão. R$ 12,00 = valor ínfimo = fato materialmente atípico.","C":"O princípio da insignificância afasta a tipicidade material — o fato não é crime tipicamente relevante para o Direito Penal.","D":"Qualquer pessoa do povo pode prender em flagrante (art. 301, CPP) — inclusive segurança particular. A prisão é válida."},"fund":"Princípio da insignificância (STF/STJ): mínima ofensividade da conduta + nenhuma periculosidade social + reduzidíssimo grau de reprovabilidade + inexpressividade da lesão ao bem jurídico. Valor de R$ 12,00 preenche os vetores. Art. 301, CPP: qualquer do povo pode efetuar prisão em flagrante.","caqui":"O princípio da insignificância afasta a tipicidade MATERIAL — o fato é formalmente típico (furto existe no CP), mas materialmente atípico (a lesão é tão pequena que o Direito Penal não precisa intervir). Três sabonetes por R$ 12 = bagatela. A banca também testa a prisão em flagrante por segurança particular — que é válida (art. 301, CPP: qualquer pessoa do povo pode prender em flagrante)."},
  {"num":30,"exame":"III Exame — 2011","titulo":"Dano Culposo","enunciado":"Pedro, não observando seu dever objetivo de cuidado na condução de uma bicicleta, choca-se com um telefone público e o destrói totalmente.","comando":"Nesse caso, é correto afirmar que Pedro","gabarito":"D","alt":{"A":"deverá ser responsabilizado pelo crime de dano simples, somente.","B":"deverá ser responsabilizado pelo crime de dano qualificado, somente.","C":"deverá ser responsabilizado pelo crime de dano qualificado, sem prejuízo da obrigação de reparar o dano causado.","D":"não será responsabilizado penalmente."},"fb":{"A":"Dano (art. 163, CP) é crime doloso — exige intenção de destruir, inutilizar ou deteriorar coisa alheia. Não existe modalidade culposa.","B":"Além de não haver dolo, o dano qualificado exige circunstâncias específicas (violência ou grave ameaça, substância inflamável ou explosiva, patrimônio público, motivo egoístico) — e o dano do art. 163 do CP não admite modalidade culposa.","C":"Não há crime de dano culposo no CP. A obrigação de reparar o dano existe civilmente, mas não há responsabilização penal.","D":"O Código Penal não prevê modalidade culposa para o crime de dano (art. 163, CP). Pedro agiu culposamente (sem intenção). Sem dolo = sem crime de dano. Pode responder civilmente pela reparação, mas não penalmente."},"fund":"Art. 163, CP: dano — destruir, inutilizar ou deteriorar coisa alheia. Dolo necessário — não há previsão de modalidade culposa. Princípio da legalidade: nullum crimen sine lege. Sem previsão de dano culposo no CP = fato penalmente atípico.","caqui":"Regra importante: sem previsão de modalidade culposa = só há crime se houver dolo. A lei é expressa quando quer punir a culpa (lesão culposa, homicídio culposo, e o dano culposo a bem especialmente protegido do art. 62, parágrafo único, da Lei 9.605/98, por exemplo). Para o dano do art. 163 do CP, não há previsão culposa. Pedro derrubou por descuido = culpa = sem crime. Mas tem responsabilidade civil — paga o prejuízo."},
  {"num":31,"exame":"II Exame — 2010","titulo":"Inserção de Dados Falsos em Sistema de Informações","enunciado":"Fundação Pública Federal contrata o técnico de informática Abelardo Fonseca para que opere o sistema informatizado destinado à elaboração da folha de pagamento de seus funcionários. Abelardo, ao elaborar a referida folha de pagamento, altera as informações sobre a remuneração dos funcionários da Fundação no sistema, descontando a quantia de cinco reais de cada um deles. A seguir, insere o seu próprio nome e sua própria conta bancária no sistema, atribuindo-se a condição de funcionário da Fundação e destina à sua conta o total dos valores desviados dos demais. Terminada a elaboração da folha, Abelardo remete as informações à seção de pagamentos, a qual efetua os pagamentos de acordo com as informações lançadas no sistema por ele.","comando":"Considerando tal narrativa, é correto afirmar que Abelardo praticou crime de","gabarito":"D","alt":{"A":"estelionato.","B":"peculato.","C":"concussão.","D":"inserção de dados falsos em sistema de informações."},"fb":{"A":"O estelionato é crime comum — qualquer pessoa pode praticar. Aqui há tipo penal específico para a conduta de Abelardo (art. 313-A, CP), que prevalece.","B":"Peculato (art. 312, CP) exige que o agente seja funcionário público. Abelardo é contratado (técnico de informática) — pode ser equiparado para fins do art. 327, CP, mas a conduta específica se enquadra melhor no art. 313-A.","C":"Concussão (art. 316, CP) é exigir vantagem indevida em razão do cargo — não é o caso.","D":"Art. 313-A, CP: inserção de dados falsos em sistema de informações — pratica o crime o funcionário autorizado que insere ou facilita inserção de dados falsos, altera ou exclui indevidamente dados corretos nos sistemas informatizados da Administração Pública com o fim de obter vantagem indevida. Abelardo era autorizado a operar o sistema e o utilizou para desviar valores."},"fund":"Art. 313-A, CP: inserção de dados falsos em sistema de informações — crime funcional específico para quem tem autorização de acesso e insere dados falsos em sistemas da Administração Pública visando vantagem indevida.","caqui":"O art. 313-A, CP foi criado especialmente para combater fraudes em sistemas informatizados da Administração Pública. A diferença do estelionato: aqui o agente tem acesso autorizado ao sistema e o usa para fraudar. A diferença do peculato: este tipo é específico para conduta via sistema de informações. Tipo específico prevalece sobre geral = art. 313-A CP, não estelionato nem peculato."},
  {"num":32,"exame":"II Exame — 2010","titulo":"Estelionato e Escusa Absolutória","enunciado":"Paula Rita convenceu sua mãe adotiva, Maria Aparecida, de 50 anos de idade, a lhe outorgar um instrumento de mandato para movimentar sua conta bancária. De posse da referida procuração, Paula Rita compareceu à agência bancária onde Maria Aparecida possuía conta e sacou todo o valor que a mesma possuía em aplicações financeiras, no total de R$ 150.000,00, apropriando-se do dinheiro antes pertencente a sua mãe.","comando":"Considerando tal narrativa, assinale a alternativa correta.","gabarito":"A","alt":{"A":"Paula Rita praticou crime de estelionato em detrimento de Maria Aparecida e, pelo fato de ser sua filha adotiva, é isenta de pena.","B":"Paula Rita praticou crime de furto mediante fraude em detrimento de Maria Aparecida e, pelo fato de ser sua filha adotiva, é isenta de pena.","C":"Paula Rita praticou crime de estelionato em detrimento de Maria Aparecida e, apesar de ser sua filha adotiva, não é isenta de pena.","D":"Paula Rita praticou crime de furto mediante fraude em detrimento de Maria Aparecida e, apesar de ser sua filha adotiva, não é isenta de pena."},"fb":{"A":"Estelionato: Paula induziu a mãe em erro (convenceu a outorgar procuração) e a mãe entregou voluntariamente os poderes = estelionato (a vítima entrega por vontade, ainda que enganada). Filha adotiva: o ECA (art. 41) equipara filhos adotivos a biológicos para todos os fins. Logo, a escusa absolutória do art. 181, II, CP (descendente que furta/esteliona ascendente) se aplica = isenção de pena. Maria tinha 50 anos = sem a exceção do art. 183, III, CP (que só afasta a escusa para vítimas com 60+ anos).","B":"Não é furto mediante fraude — é estelionato. No furto mediante fraude, o agente subtrai o bem. No estelionato, a vítima entrega voluntariamente (ainda que enganada). A mãe deu a procuração voluntariamente.","C":"A escusa absolutória se aplica — filha adotiva (equiparada à biológica) + vítima com 50 anos (sem exceção do art. 183, III).","D":"Duplo erro: crime errado (furto, não estelionato) e sem a escusa absolutória."},"fund":"Art. 171, CP: estelionato — obter vantagem ilícita induzindo/mantendo alguém em erro. Diferença estelionato x furto mediante fraude: na fraude, a vítima entrega o bem voluntariamente = estelionato. Art. 181, II, CP: escusa absolutória entre ascendentes e descendentes. Art. 41, ECA: filhos adotivos equiparados a biológicos para todos os fins, inclusive direitos e deveres. Maria tem 50 anos = sem exceção do art. 183, III, CP.","caqui":"Dois pontos cruciais: (1) Estelionato ou furto mediante fraude? A mãe ENTREGOU os poderes voluntariamente (assinou a procuração) = estelionato. Se a Paula tivesse pegado o cartão sem permissão = furto mediante fraude. (2) Filha adotiva = filha biológica para todos os fins (ECA, art. 41). A escusa absolutória do art. 181, II, CP se aplica entre descendentes e ascendentes — inclui filha adotiva. E a vítima tem 50 anos = sem a exceção do art. 183, III (que exige 60+). Resultado: estelionato + escusa absolutória = isenta de pena."},
];

let current=0;
const estado=Array(QUESTOES.length).fill(null);

function init(){
  const nav=document.getElementById('nav-wrap');
  const cont=document.getElementById('questions-container');
  QUESTOES.forEach((q,i)=>{
    const nb=document.createElement('button');
    nb.className='nav-btn'+(i===0?' active':'');
    nb.textContent=i+1;nb.onclick=()=>goTo(i);nb.id='nav-'+i;
    nav.appendChild(nb);
    const card=document.createElement('div');
    card.className='q-card'+(i===0?' visible':'');card.id='card-'+i;
    card.innerHTML=buildCard(q,i);cont.appendChild(card);
  });
  updatePagination();updateScore();
}

function buildCard(q,i){
  const alts=Object.entries(q.alt).map(([l,t])=>`<button class="alt-btn" onclick="responder(${i},'${l}',this)" data-letra="${l}"><span class="alt-letter">${l}</span><span class="alt-text">${t}</span></button>`).join('');
  return `<div class="q-header"><span class="q-num">Questão ${q.num}</span>${q.exame?`<span class="q-exame">${q.exame}</span>`:''}</div>
    <h2 class="q-titulo">${q.titulo}</h2>
    <div class="enunciado">${q.enunciado}</div>
    <p class="comando">${q.comando}</p>
    <div class="alternativas" id="alts-${i}">${alts}</div>
    <div class="feedback" id="fb-${i}"></div>
    <div class="fundamento-box" id="fund-${i}"><h4>📖 Fundamento legal</h4>${q.fund}</div>
    <div class="caqui-box" id="caqui-${i}"><h4>🍊 Explicação didática do Professor Caqui</h4>${q.caqui}</div>
    <div class="card-actions"><div class="btn-group">
      <button class="btn verm" id="btn-fund-${i}" onclick="toggleFund(${i})">Ver fundamento legal</button>
      <button class="btn caqui" id="btn-caqui-${i}" onclick="toggleCaqui(${i})">Explicação do Prof. Caqui</button>
      <button class="btn" id="btn-reset-${i}" onclick="resetQ(${i})">↺ Tentar novamente</button>
    </div><span class="status-text" id="status-${i}"></span></div>`;
}

function responder(idx,letra,btn){
  if(estado[idx]!==null)return;
  estado[idx]=letra;
  const q=QUESTOES[idx];
  document.querySelectorAll(`#alts-${idx} .alt-btn`).forEach(b=>{
    b.disabled=true;
    if(b.dataset.letra===q.gabarito)b.classList.add('correct');
    if(b.dataset.letra===letra&&letra!==q.gabarito)b.classList.add('wrong');
  });
  const acertou=letra===q.gabarito;
  const fb=document.getElementById('fb-'+idx);
  fb.className='feedback show '+(acertou?'acerto':'erro');
  fb.innerHTML=`<strong>${acertou?'✓ Correta!':'✗ Incorreta.'}</strong> ${q.fb[letra]}`;
  document.getElementById('status-'+idx).textContent=acertou?'Acerto!':'Gabarito: '+q.gabarito;
  document.getElementById('btn-reset-'+idx).className='btn show';
  document.getElementById('btn-fund-'+idx).className='btn verm show';
  document.getElementById('btn-caqui-'+idx).className='btn caqui show';
  const navBtn=document.getElementById('nav-'+idx);
  navBtn.classList.remove('active');navBtn.classList.add(acertou?'correto':'errado');
  if(idx===current)navBtn.classList.add('active');
  updateScore();
}

function toggleFund(idx){
  const box=document.getElementById('fund-'+idx);
  const btn=document.getElementById('btn-fund-'+idx);
  const v=box.classList.contains('show');
  box.className=v?'fundamento-box':'fundamento-box show';
  btn.textContent=v?'Ver fundamento legal':'Ocultar fundamento';
}

function toggleCaqui(idx){
  const box=document.getElementById('caqui-'+idx);
  const btn=document.getElementById('btn-caqui-'+idx);
  const v=box.classList.contains('show');
  box.className=v?'caqui-box':'caqui-box show';
  btn.textContent=v?'Explicação do Prof. Caqui':'Ocultar explicação';
}

function resetQ(idx){
  estado[idx]=null;
  document.querySelectorAll(`#alts-${idx} .alt-btn`).forEach(b=>{b.disabled=false;b.className='alt-btn';});
  document.getElementById('fb-'+idx).className='feedback';
  document.getElementById('fund-'+idx).className='fundamento-box';
  document.getElementById('btn-fund-'+idx).className='btn verm';
  document.getElementById('btn-fund-'+idx).textContent='Ver fundamento legal';
  document.getElementById('caqui-'+idx).className='caqui-box';
  document.getElementById('btn-caqui-'+idx).className='btn caqui';
  document.getElementById('btn-caqui-'+idx).textContent='Explicação do Prof. Caqui';
  document.getElementById('btn-reset-'+idx).className='btn';
  document.getElementById('status-'+idx).textContent='';
  document.getElementById('nav-'+idx).className='nav-btn'+(idx===current?' active':'');
  updateScore();
}

function goTo(idx){
  document.getElementById('card-'+current).classList.remove('visible');
  document.getElementById('nav-'+current).classList.remove('active');
  current=idx;
  document.getElementById('card-'+current).classList.add('visible');
  document.getElementById('nav-'+current).classList.add('active');
  updatePagination();window.scrollTo({top:0,behavior:'smooth'});
}

function navPage(dir){const next=current+dir;if(next>=0&&next<QUESTOES.length)goTo(next);}

function updatePagination(){
  document.getElementById('pg-info').textContent=(current+1)+' de '+QUESTOES.length;
  document.getElementById('btn-prev').disabled=current===0;
  document.getElementById('btn-next').disabled=current===QUESTOES.length-1;
}

function updateScore(){
  const respondidas=estado.filter(e=>e!==null).length;
  const acertos=estado.filter((e,i)=>e===QUESTOES[i].gabarito).length;
  const erros=respondidas-acertos;
  document.getElementById('sc-total').textContent=respondidas;
  document.getElementById('sc-acertos').textContent=acertos;
  document.getElementById('sc-erros').textContent=erros;
  const pct=Math.round((respondidas/QUESTOES.length)*100);
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('progress-label').textContent=respondidas+' de '+QUESTOES.length+' respondidas';
}

init();
</script>
</body>
</html>
